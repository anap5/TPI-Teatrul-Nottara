<!DOCTYPE html>

<html lang="ro">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Teatrul Nottara
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>


<body>

    <header class="header">

        <div class="header-content">

            <a
                href="{{ url_for('shows') }}"
                class="logo"
            >
                NOTTARA
            </a>

            <nav>
                <a href="{{ url_for('shows') }}">
                    Spectacole
                </a>

                <a href="{{ url_for('schedule') }}">
                    Program
                </a>
            </nav>

        </div>

    </header>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <footer>
        <p>
            Proiect Tehnologii Web · Teatrul Nottara
        </p>
    </footer>

</body>

</html>
